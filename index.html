
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainrot Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif;padding:16px}
header{text-align:center;padding:20px 0}
h1{margin:0 0 8px;font-size:29px}
header p,.muted{color:#aab4d0}
.search{width:100%;padding:15px;border-radius:12px;border:1px solid #36415f;background:#171f35;color:white;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{padding:10px 12px;border:1px solid #35405e;border-radius:20px;background:#171f35;color:white;font-weight:bold}
button.active{background:#7c3aed;border-color:#a78bfa}
#count{font-size:13px;color:#aab4d0;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#171f35;border:1px solid #303b5c;border-radius:15px;padding:14px;min-width:0}
.emoji{font-size:36px}
.card h3{font-size:15px;overflow-wrap:anywhere;min-height:36px}
.tag{display:inline-block;padding:6px 8px;border-radius:8px;font-size:11px;font-weight:bold}
.Common{background:#334155;color:#f1f5f9}
.Rare{background:#1d4ed8;color:#dbeafe}
.Epic{background:#7e22ce;color:#f3e8ff}
.Legendary{background:#854d0e;color:#fef3c7}
.Mythic{background:#9f1239;color:#ffe4e6}
.God{background:#9a3412;color:#ffedd5}
.Secret{background:#374151;color:#f9a8d4}
.OG{background:#713f12;color:#fef08a}
.empty{grid-column:1/-1;text-align:center;padding:25px;color:#aab4d0}
footer{text-align:center;color:#8490af;font-size:12px;margin:30px 0}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>🧠 Brainrot Finder</h1>
<p>Steal a Brainrot Companion Catalog</p>
</header>

<input class="search" id="search" placeholder="🔎 Search brainrots..." aria-label="Search brainrots">
<div class="filters" id="filters"></div>
<div id="count"></div>
<div class="grid" id="grid"></div>
<footer>Fan-made companion • Not affiliated with Roblox</footer>

<script>
const rarities=[
"All","Common","Rare","Epic","Legendary","Mythic",
"Brainrot God","Secret","OG"
];

const brainrots=[
{name:"Noobini Pizzanini",rarity:"Common",emoji:"🍕"},
{name:"Lirili Larila",rarity:"Common",emoji:"🐘"},
{name:"Tim Cheese",rarity:"Common",emoji:"🧀"},
{name:"Fluriflura",rarity:"Common",emoji:"🌸"},
{name:"Trippi Troppi",rarity:"Rare",emoji:"🦐"},
{name:"Tung Tung Tung Sahur",rarity:"Rare",emoji:"🪵"},
{name:"Gangster Footera",rarity:"Rare",emoji:"🦶"},
{name:"Boneca Ambalabu",rarity:"Epic",emoji:"🐸"},
{name:"Cappuccino Assassino",rarity:"Epic",emoji:"☕"},
{name:"Tralalero Tralala",rarity:"Epic",emoji:"🦈"},
{name:"Bombardiro Crocodilo",rarity:"Legendary",emoji:"🐊"},
{name:"Brr Brr Patapim",rarity:"Legendary",emoji:"🌳"},
{name:"Chimpanzini Bananini",rarity:"Legendary",emoji:"🍌"},
{name:"Ballerina Cappuccina",rarity:"Mythic",emoji:"🩰"},
{name:"Cocofanto Elefanto",rarity:"Mythic",emoji:"🐘"},
{name:"Frigo Camelo",rarity:"Mythic",emoji:"🐪"},
{name:"Girafa Celeste",rarity:"God",emoji:"🦒"},
{name:"Gattatino Nyanino",rarity:"God",emoji:"🐱"},
{name:"Chicleteira Bicicleteira",rarity:"God",emoji:"🚲"},
{name:"Odin Din Din Dun",rarity:"Secret",emoji:"⚡"},
{name:"La Grande Combinasion",rarity:"Secret",emoji:"🧩"},
{name:"Garama and Madundung",rarity:"Secret",emoji:"✨"},
{name:"Strawberry Elephant",rarity:"OG",emoji:"🍓"}
];

const filterBox=document.getElementById("filters");
const search=document.getElementById("search");
const grid=document.getElementById("grid");
const count=document.getElementById("count");
let selected="All";

rarities.forEach(r=>{
 const b=document.createElement("button");
 b.textContent=r;
 b.className=r==="All"?"active":"";
 b.onclick=()=>{
  selected=r;
  [...filterBox.children].forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  render();
 };
 filterBox.appendChild(b);
});

function render(){
 const term=search.value.trim().toLowerCase();
 const list=brainrots.filter(b=>
  (selected==="All"||
   (selected==="Brainrot God"?b.rarity==="God":b.rarity===selected))&&
  b.name.toLowerCase().includes(term)
 );
 count.textContent=list.length+" brainrot"+(list.length===1?"":"s")+" found";
 grid.innerHTML="";
 if(!list.length){
  grid.innerHTML='<div class="empty">No brainrots found. Try another search!</div>';
  return;
 }
 list.forEach(b=>{
  const card=document.createElement("article");
  card.className="card";
  const emoji=document.createElement("div");
  emoji.className="emoji";
  emoji.textContent=b.emoji;
  const name=document.createElement("h3");
  name.textContent=b.name;
  const tag=document.createElement("span");
  tag.className="tag "+b.rarity;
  tag.textContent=b.rarity==="God"?"BRAINROT GOD":b.rarity.toUpperCase();
  card.append(emoji,name,tag);
  grid.appendChild(card);
 });
}
search.addEventListener("input",render);
render();
</script>
</body>
</html>
